<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koripallo – otteluraportti</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#17212d;font:14px Arial,sans-serif}
.toolbar{max-width:1100px;margin:18px auto;padding:12px;background:#fff;border:1px solid #ccd4dd;border-radius:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input{padding:9px;border:1px solid #aeb9c5;border-radius:5px}.toolbar button{padding:10px 16px;background:#172b42;color:#fff;border:0;border-radius:5px;font-weight:bold;cursor:pointer}
#status{font-size:12px;color:#8b3c22}.page{background:#fff;max-width:1100px;margin:16px auto;padding:26px;box-shadow:0 2px 12px #0001}
h1{font-size:25px;margin:0 0 5px;text-align:center}#meta{text-align:center;color:#586575;margin-bottom:20px}
h2{font-size:16px;margin:20px 0 8px;padding-bottom:5px;border-bottom:2px solid #263e57;text-transform:uppercase;letter-spacing:.04em}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:16px}.team{border:1px solid #cbd3dc;border-radius:6px;overflow:hidden}
.teamhead{background:#edf1f5;padding:9px 12px;font-weight:bold;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:5px 6px;border-bottom:1px solid #e0e4e8;text-align:center}th{background:#f3f5f7;font-size:10px}td:first-child,th:first-child{text-align:left}
.roster{font-size:13.75px}.roster th,.roster td{font-size:13.75px}.roster td:first-child{width:35px;font-weight:bold;color:#233f5a}.roster td:nth-child(2){text-align:left}
.standings{font-size:12.5px}.standings th,.standings td{font-size:12.5px}.standings td:nth-child(2){text-align:left}.standings .playing-team{font-weight:800}
.stats{font-size:11.25px;table-layout:fixed}.stats th,.stats td{font-size:11.25px;padding:4px 3px;white-space:nowrap}
.note{color:#6d7782;font-size:10px;margin-top:5px}.section{break-inside:avoid}
@media(max-width:700px){.page{margin:0;padding:14px}.teams{grid-template-columns:1fr}.toolbar{margin:0;border-radius:0}}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff}.toolbar{display:none!important}.page{max-width:none;margin:0;padding:0;box-shadow:none}
 h1{font-size:20px}h2{margin-top:13px;font-size:13px}
 .teamhead{padding:6px 8px;font-size:14px}table{font-size:9px}
 .roster th,.roster td{padding:3px 5px;font-size:11.25px}.standings{font-size:10px}.standings th,.standings td{font-size:10px}.stats{font-size:8.75px}
 .stats th,.stats td{font-size:8.75px;padding:2px}
}
</style></head><body>
<div class="toolbar">
<label>Ottelun ID <input id="matchId" placeholder="esim. 1020490"></label>
<label>Päivämäärä <input id="matchDate" type="date"></label>
<button id="loadBtn">Hae otteluraportti</button><button onclick="window.print()">Tulosta A4</button>
<span id="status"></span>
</div>
<main class="page">
<h1 id="title">OTTELUN RAPORTTI</h1><div id="meta">Kokoonpanot · sarjataulukko · kauden pelaajatilastot</div>
<section class="section"><h2>Ottelun kokoonpanot</h2><div class="teams" id="rosters"><div>Syötä ottelun ID ja hae raportti.</div></div></section>
<section class="section"><h2>Sarjataulukko</h2><div id="standings">Odottaa ottelun tietoja.</div></section>
<section class="section"><h2>Joukkueiden kauden pelaajatilastot</h2><div class="teams" id="stats"></div><div class="note">Pelaajatilastot Sportradarista. Sarjataulukko TorneoPal-palvelusta.</div></section>
</main>
<script>
const TP='https://koripallo-api.torneopal.net/taso/rest/';
const SEED='ysnyp4h6e9egetkc3s3v', ACCEPT='json/df8e84j9xtdz269euy3h';
const SR='https://embed-api.eui.connect.sportradar.com/v1/embed/322/';
const $=id=>document.getElementById(id);
function personName(v){let x=String(v||'').trim().toLocaleLowerCase('fi-FI');return x.replace(/(^|[\s-])([\p{L}])/gu,(m,a,b)=>a+b.toLocaleUpperCase('fi-FI'));}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function status(s){$('status').textContent=s}
async function hash(endpoint,params){let src=endpoint+'?'+SEED;for(const k of Object.keys(params))src+='&'+k+'='+params[k];let d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(src));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function json(url){let r=await fetch(url,{cache:'no-store',headers:{Accept:ACCEPT,Referer:'https://tulospalvelu.basket.fi/'}});let t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Virheellinen JSON-vastaus (HTTP '+r.status+')')};if(!r.ok)throw Error('HTTP '+r.status+': '+t.slice(0,200));return j}
function findMatch(root,id){if(!root||typeof root!=='object')return null;if(root.match_id!=null&&String(root.match_id)===String(id))return root;for(const v of Object.values(root)){if(v&&typeof v==='object'){let x=findMatch(v,id);if(x)return x}}return null}
async function torneo(endpoint,params){let h=await hash(endpoint,params);let q=new URLSearchParams({...params,hash:h});return json(TP+endpoint+'?'+q)}
function playerRows(side){let a=side?.persons?.[0]?.rows||[];return a.map(p=>({n:p.bib??'–',name:personName(p.personName||'')})).filter(x=>x.name).sort((a,b)=>(Number(a.n)||999)-(Number(b.n)||999))}
function rosterCard(name,players){return `<div class="team"><div class="teamhead">${esc(name)}</div><table class="roster"><thead><tr><th>#</th><th>Pelaaja</th></tr></thead><tbody>${players.length?players.map(p=>`<tr><td>${esc(p.n)}</td><td>${esc(p.name)}</td></tr>`).join(''):'<tr><td colspan="2">Kokoonpanoa ei ole julkaistu</td></tr>'}</tbody></table></div>`}
function groupRows(g){return (g?.statistics||[]).map(r=>{let o={name:r.person?.name||r.name||'',team:r.entity?.name||r.entityName||''};(g.headers||[]).forEach((h,i)=>o[h.key]=r.statistics?.[i]);return o})}
function groupKey(g){return String(g?.label?.key||g?.label?.text||'').toLowerCase()}
function findGroup(groups,key){return groups.find(g=>groupKey(g).includes(key))||null}
function normName(s){return String(s||'').trim().toLocaleLowerCase('fi-FI').replace(/\s+/g,' ')}
function fmt(v,key){
 if(v===null||v===undefined||v==='')return '–';
 if(key==='minutesPerGame' && typeof v==='string'){
   // Sportradar antaa peliajan usein ISO 8601 -kestona, esim. PT18M47S.
   const m=v.match(/^PT(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)S)?$/i);
   if(m){
     const totalSeconds=Math.round((Number(m[1]||0)*3600)+(Number(m[2]||0)*60)+Number(m[3]||0));
     const minutes=Math.floor(totalSeconds/60), seconds=totalSeconds%60;
     return `${minutes}:${String(seconds).padStart(2,'0')}`;
   }
 }
 if(typeof v==='number')return Number.isInteger(v)?String(v):v.toFixed(1).replace('.',',');
 return v;
}
function renderStats(team,groups){
 let averages=findGroup(groups,'averages')||groups[0];
 let shooting=findGroup(groups,'shootingstatistics');
 let baseRows=groupRows(averages).filter(r=>normName(r.team)===normName(team));
 let shootingRows=shooting?groupRows(shooting).filter(r=>normName(r.team)===normName(team)):[];
 let shootingByName=new Map(shootingRows.map(r=>[normName(r.name),r]));
 let rows=baseRows.map(r=>({...r,...(shootingByName.get(normName(r.name))||{})}));
 const wanted=[
  ['O',['games']],['PPO',['pointsPerGame']],['MPO',['minutesPerGame']],
  ['2P%',['pointsTwoPercentage']],['3P%',['pointsThreePercentage']],['VH%',['freeThrowsPercentage']],
  ['LP',['reboundsPerGame','totalReboundsPerGame']],['R',['stealsPerGame']],['V',['foulsPersonalPerGame']]
 ];
 let cols=wanted.map(([label,keys])=>{
   let key=keys.find(k=>averages?.headers?.some(h=>h.key===k)||shooting?.headers?.some(h=>h.key===k));
   return key?{key,label}:null;
 }).filter(Boolean);
 return `<div class="team"><div class="teamhead">${esc(team)} – kauden keskiarvot</div><table class="stats"><thead><tr><th>Pelaaja</th>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(personName(r.name))}</td>${cols.map(c=>`<td>${esc(fmt(r[c.key],c.key))}</td>`).join('')}</tr>`).join(''):'<tr><td colspan="'+(cols.length+1)+'">Pelaajatilastoja ei löytynyt.</td></tr>'}</tbody></table></div>`;
}
async function load(){let id=$('matchId').value.trim(),date=$('matchDate').value;if(!id){status('Anna ottelun ID.');return}if(!date){status('Valitse ottelun päivämäärä.');return}
 try{status('Haetaan ottelua…');$('rosters').innerHTML='';$('stats').innerHTML='';
 let matches=await torneo('getMatches',{date});let m=findMatch(matches,id);if(!m)throw Error('Ottelua ei löytynyt valitulta päivältä.');
 if(!m.match_external_id)throw Error('Ottelulta puuttuu Sportradar-tunnus.');
 status('Haetaan kokoonpanoja ja sarjataulukkoa…');
 let [detail,group]=await Promise.all([json(SR+'fixture_detail?fixtureId='+encodeURIComponent(m.match_external_id)),torneo('getGroup',{competition_id:m.competition_id,category_id:m.category_id,group_id:m.group_id})]);
 let root=detail.data||detail,fixture=root.fixture||{},competitors=fixture.competitors||[];
 let home=competitors.find(c=>c.isHome)||competitors[0]||{},away=competitors.find(c=>!c.isHome)||competitors[1]||{};
 let base=root.statistics?.data?.base||{};
 $('title').textContent=(home.name||m.team_A_name||'Koti')+' – '+(away.name||m.team_B_name||'Vieras');
 $('meta').textContent=[m.competition_name,m.category_name,m.group_name,date,m.time].filter(Boolean).join(' · ');
 $('rosters').innerHTML=rosterCard(home.name||m.team_A_name,playerRows(base.home||{}))+rosterCard(away.name||m.team_B_name,playerRows(base.away||{}));
 let teams=group.group?.teams||group.data?.group?.teams||[];let playingNames=[home.name||m.team_A_name,away.name||m.team_B_name].filter(Boolean).map(x=>x.trim().toLocaleLowerCase('fi-FI'));
 $('standings').innerHTML=teams.length?`<table class="standings"><thead><tr><th>#</th><th>Joukkue</th><th>O</th><th>V</th><th>H</th><th>Tehdyt</th><th>Päästetyt</th><th>+/−</th><th>P</th></tr></thead><tbody>${teams.sort((a,b)=>Number(a.current_standing)-Number(b.current_standing)).map(t=>`<tr><td>${esc(t.current_standing)}</td><td class="${playingNames.includes(String(t.team_name||'').trim().toLocaleLowerCase('fi-FI'))?'playing-team':''}">${esc(personName(t.team_name))}</td><td>${esc(t.matches_played)}</td><td>${esc(t.matches_won)}</td><td>${esc(t.matches_lost)}</td><td>${esc(t.goals_for)}</td><td>${esc(t.goals_against)}</td><td>${esc(t.goals_diff)}</td><td>${esc(t.points)}</td></tr>`).join('')}</tbody></table>`:'Sarjataulukkoa ei löytynyt.';
 status('Haetaan kauden pelaajatilastoja…');
 let seasonId=fixture.seasonId||root.banner?.season?.id;if(seasonId){let s=await json(SR+'statistics_persons?seasonId='+encodeURIComponent(seasonId));let groups=s.data?.statistics||[];$('stats').innerHTML=[home.name,away.name].map(n=>renderStats(n,groups)).join('')}
 else $('stats').textContent='Kauden tunnusta ei löytynyt ottelun tiedoista.';
 status('Valmis. Voit tulostaa raportin A4-koossa.');
 }catch(e){status('Virhe: '+(e.message||e));}}
$('loadBtn').addEventListener('click',load);
let p=new URLSearchParams(location.search);if(p.get('match'))$('matchId').value=p.get('match');if(p.get('date'))$('matchDate').value=p.get('date');else $('matchDate').value=new Date().toLocaleDateString('en-CA');
if(p.get('match'))load();
</script></body></html>
