<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koripallo – pelaajatilastot</title>
<style>
:root{--navy:#07101a;--navy2:#0c1825;--muted:#aeb8c4;--gold:#ffd23f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,Helvetica,sans-serif}
.stage{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:0;width:max-content;max-width:none;transition:opacity .2s ease}
.spacer{width:450px;flex:0 0 450px;height:1px;pointer-events:none}
.panel{width:min(390px,calc((100vw - 30px)/2));max-height:78vh;overflow:hidden;background:linear-gradient(180deg,rgba(12,24,37,.97),rgba(7,16,26,.97));border:1px solid rgba(255,255,255,.28);box-shadow:0 8px 25px rgba(0,0,0,.45);border-radius:3px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:linear-gradient(90deg,#13283b,#09131e);border-bottom:2px solid var(--gold)}
.title{font-size:14px;font-weight:900;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side{font-size:9px;letter-spacing:.12em;color:var(--gold);font-weight:900}
table{width:100%;border-collapse:collapse;table-layout:fixed}th{padding:5px 6px;color:var(--muted);font-size:10px;text-align:right;background:rgba(0,0,0,.24)}th:first-child{text-align:left}td{padding:6px;border-top:1px solid rgba(255,255,255,.09);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}tr:nth-child(even){background:rgba(255,255,255,.035)}td.num{text-align:right}td.points{color:var(--gold);font-weight:900}td.player{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shirt{display:inline-block;min-width:22px;color:var(--muted);font-size:10px}.empty{padding:12px 8px;color:var(--muted);font-size:11px;text-align:center}
.stage.hidden{opacity:0;pointer-events:none}
@media(max-width:650px){.stage{transform:translateX(-50%) scale(.75);transform-origin:bottom center}.spacer{width:450px;flex-basis:450px}.panel{width:390px}.head{padding:7px 6px}.title{font-size:11px}th{font-size:9px;padding:4px 3px}td{font-size:10px;padding:4px 3px}.shirt{min-width:17px}}
</style></head><body>
<div class="stage" id="stage">
<section class="panel"><div class="head"><div class="title" id="homeStatsTitle">KOTIJOUKKUE</div><div class="side">KOTI</div></div><table><colgroup><col style="width:66%"><col style="width:17%"><col style="width:17%"></colgroup><thead><tr><th>PELAAJA</th><th>VIRH.</th><th>PIST.</th></tr></thead><tbody id="homeStatsRows"><tr><td colspan="3" class="empty">Haetaan tietoja…</td></tr></tbody></table></section>
<div class="spacer" aria-hidden="true"></div><section class="panel"><div class="head"><div class="title" id="awayStatsTitle">VIERASJOUKKUE</div><div class="side">VIERAS</div></div><table><colgroup><col style="width:66%"><col style="width:17%"><col style="width:17%"></colgroup><thead><tr><th>PELAAJA</th><th>VIRH.</th><th>PIST.</th></tr></thead><tbody id="awayStatsRows"><tr><td colspan="3" class="empty">Haetaan tietoja…</td></tr></tbody></table></section>
</div>
<script>
let MATCH_ID="1006004";
const params=new URLSearchParams(location.search);if(/^\d+$/.test(params.get("match")||""))MATCH_ID=params.get("match");
const API="https://koripallo-api.torneopal.net/taso/rest/",ACCEPT_VALUE="json/df8e84j9xtdz269euy3h";
const $=id=>document.getElementById(id);
function statsEsc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function statsIsFoul(e){
 const c=String(e?.code||"").toLowerCase(), d=String(e?.description||e?.code_fi||"").toLowerCase();
 return c==="virhe" || d.includes("virhe");
}
function statsPoints(e){
 const c=String(e?.code||"").toLowerCase(), d=String(e?.description||e?.code_fi||"").toLowerCase();
 if(c!=="maali" && !c.includes("vapaa") && !c.includes("rangaistus") && !d.includes("vapaaheitto")) return 0;
 if(d.includes("3 ")||d.includes("3p")||d.includes("kolmen")) return 3;
 if(d.includes("vap")||d.includes("ft")||d.includes("1 ")||c.includes("vapaa")||c.includes("rangaistus")) return 1;
 return 2;
}
function statsSide(e){
 const s=String(e?.kotivieras||e?.home_away||e?.team_side||"").toLowerCase();
 if(["koti","home","a","team_a"].includes(s))return "home";
 if(["vieras","away","b","team_b"].includes(s))return "away";
 return "";
}
function statsKey(e){
 const id=e?.player_id, name=String(e?.player_name||e?.name||"").trim();
 if((id===undefined||id===null||String(id)==="")&&!name)return "";
 return id!==undefined&&id!==null&&String(id)!==""?"id:"+id:"name:"+name.toLowerCase();
}
function statsAdd(map,e){
 const key=statsKey(e); if(!key)return;
 if(!map.has(key))map.set(key,{name:String(e.player_name||e.name||"Tuntematon pelaaja").trim(),number:String(e.shirt_number??e.number??"").trim(),points:0,fouls:0});
 const p=map.get(key);p.points+=statsPoints(e);if(statsIsFoul(e))p.fouls++;
}
function statsRender(id,map){
 const arr=[...map.values()].sort((a,b)=>(Number(a.number)||999)-(Number(b.number)||999)||a.name.localeCompare(b.name,"fi"));
 $(id).innerHTML=arr.length?arr.map(p=>`<tr><td class="player"><span class="shirt">${p.number?"#"+statsEsc(p.number):""}</span> ${statsEsc(p.name)}</td><td class="num">${p.fouls}</td><td class="num points">${p.points}</td></tr>`).join(""):'<tr><td colspan="3" class="empty">Ei pelaajatietoja tapahtumissa</td></tr>';
}
async function pollPlayerStats(){
 try{
  const response=await fetch(API+"getMatch?match_id="+encodeURIComponent(MATCH_ID)+"&timeStamp="+Date.now(),{cache:"no-store",headers:{Accept:ACCEPT_VALUE}});
  if(!response.ok)throw new Error("HTTP "+response.status);
  const data=await response.json();if(data?.call?.status==="error")throw new Error(data.call.error||"API-virhe");
  const m=data.match||data?.data?.match||data?.data||data||{};
  $("homeStatsTitle").textContent=m.team_A_name||"KOTIJOUKKUE";$("awayStatsTitle").textContent=m.team_B_name||"VIERASJOUKKUE";
  const home=new Map(),away=new Map(),events=Array.isArray(m.events)?m.events:[];const a=String(m.team_A_id??""),b=String(m.team_B_id??"");
  for(const e of events){let side=statsSide(e);if(!side){const tid=String(e.team_id??e.club_id??e.team??"");if(tid&&a&&tid===a)side="home";else if(tid&&b&&tid===b)side="away";}if(side==="home")statsAdd(home,e);else if(side==="away")statsAdd(away,e);}
  statsRender("homeStatsRows",home);statsRender("awayStatsRows",away);
 }catch(e){$("homeStatsRows").innerHTML='<tr><td colspan="3" class="empty">Tilastot eivät saatavilla</td></tr>';$("awayStatsRows").innerHTML='<tr><td colspan="3" class="empty">Tilastot eivät saatavilla</td></tr>';}
}
// Näkyvyys: lisää URL-osoitteeseen ?hidden=1 piilottaaksesi paneelit. Näppäin T vaihtaa näkyvyyttä.
if(params.get("hidden")==="1")$("stage").classList.add("hidden");
document.addEventListener("keydown",e=>{if(e.key.toLowerCase()==="t")$("stage").classList.toggle("hidden");});
pollPlayerStats();setInterval(pollPlayerStats,3000);
</script></body></html>
