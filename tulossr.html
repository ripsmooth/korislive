<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koripallon TV-tulostaulu – Sportradar / simulaatio</title>
<style>

:root{
  --navy:#07101a;
  --navy2:#0c1825;
  --line:rgba(255,255,255,.18);
  --muted:#aeb8c4;
  --red:#ff3038;
  --green:#6fe08f;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:transparent;color:#fff;
}
body{display:flex;align-items:flex-end;justify-content:center}

.overlay{
  --scale:1;
  width:450px;
  max-width:calc(100vw - 12px);
  margin:0 auto 24px;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.55));
  transform:translateY(120%) scale(var(--scale));
  transform-origin:bottom center;
  animation:scoreIn .6s cubic-bezier(.2,.8,.2,1) .1s forwards;
}
@keyframes scoreIn{to{transform:translateY(0) scale(var(--scale))}}

/* Main scoreboard: closely follows the supplied mockup */
.mainbar{
  position:relative;
  width:100%;
  height:100px;
  display:grid;
  grid-template-columns:171px 108px 171px;
  overflow:hidden;
  background:linear-gradient(180deg,#0d1a27 0%,#07111b 100%);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 8px 25px rgba(0,0,0,.45);
}

/* angled central section */
.mainbar:before,.mainbar:after{
  content:"";
  position:absolute;top:0;bottom:0;width:29px;
  z-index:4;pointer-events:none;
}
.mainbar:before{
  left:171px;
  background:linear-gradient(180deg,#101f2d,#09131e);
  clip-path:polygon(0 0,100% 0,66% 100%,0 100%);
  border-left:1px solid rgba(255,255,255,.12);
}
.mainbar:after{
  right:171px;
  background:linear-gradient(180deg,#101f2d,#09131e);
  clip-path:polygon(0 0,100% 0,100% 100%,34% 100%);
  border-right:1px solid rgba(255,255,255,.12);
}

.team{
  position:relative;min-width:0;height:100px;
  display:flex;align-items:center;
  z-index:2;
}
.team.home{padding-left:8px;padding-right:12px}
.team.away{padding-left:12px;padding-right:8px;justify-content:flex-end}

.logo-plate{
  height:98px;width:80px;flex:0 0 80px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#e8edf1,#bfc8d0);
}
.team.home .logo{
    transform:translateX(-6px);
}

.team.away .logo{
    transform:translateX(4px);
}
.team.home .logo-plate{
  clip-path:polygon(0 0,100% 0,75% 100%,0 100%);
  margin-left:-10px;margin-right:8px;
}
.team.away .logo-plate{
  order:3;
  clip-path:polygon(0 0,100% 0,100% 100%,25% 100%);
  margin-left:8px;margin-right:-10px;
}
.logo{
  width:43px;height:43px;object-fit:contain;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));
}

.team-copy{
  position:relative;min-width:0;flex:1;height:100px;
}
.teamname{
  position:absolute;left:0;right:0;top:18px;
  font-size:13px;line-height:1.05;font-weight:900;
  white-space:normal;overflow:hidden;text-overflow:ellipsis;
  max-width:78px;
}
.teamline1,.teamline2{
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.teamline2{margin-top:1px;font-size:.92em;font-weight:800;color:#d5dbe2}
.team.away .team-copy{text-align:center}
.team.home .team-copy{text-align:center}
.team.away .teamname{left:0;right:0}
.team.home .teamname{left:0;right:0}

.score-wrap{
  position:absolute;left:0;right:0;bottom:2px;
  display:flex;align-items:center;gap:5px;
}
.team.home .score-wrap{justify-content:center}
.team.away .score-wrap{justify-content:center}
.score{
  font-size:45px;line-height:.8;font-weight:900;
  letter-spacing:-.045em;font-variant-numeric:tabular-nums;
  transform:translateY(-8px);
}
.foulballs{
  position:absolute;
  top:2px;
  left:0;
  width:82px;
  height:12px;
  padding:0;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:flex-start;
  gap:4px;
  box-sizing:border-box;
  background:transparent;
  border:0;
  border-radius:0;
  z-index:20;
  overflow:visible;
}
.team.away .foulballs{
  left:auto;
  right:-16px;
  top:2px;
}
.foulball{
  display:block;
  width:10px;
  height:10px;
  min-width:10px;
  min-height:10px;
  flex:0 0 10px;
  border-radius:50%;
  border:1px solid #07101a;
  background:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.5);
  opacity:1;
  visibility:visible;
  transition:background .2s ease,box-shadow .2s ease;
}

.foulball.active{
  background:var(--red);
  box-shadow:0 0 5px rgba(255,48,56,.35);
}
.foulball.new{animation:foulRise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes foulRise{
  0%{opacity:.4;transform:scaleX(.65)}
  70%{opacity:1;transform:scaleX(1.08)}
  100%{opacity:1;transform:scaleX(1)}
}


/* Center */
.center{
  position:relative;z-index:6;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(180deg,#0b1825,#07111b);
}
.period{
  position:absolute;top:5px;
  min-width:66px;text-align:center;
  padding:2px 6px;border-radius:2px;
  background:#17304a;
  font-size:8px;font-weight:900;letter-spacing:.06em;
}
.clock{
  margin-top:8px;
  font-size:28px;line-height:1;
  font-weight:900;font-variant-numeric:tabular-nums;
}
.timeouts{
  display:none;
}
.center:after{
  content:"";
  position:absolute;right:0;top:0;bottom:0;width:1px;
  background:rgba(255,255,255,.1);
}

/* Quarters and live status retain v6 functionality, but compact */
.quarters{
  width:100%;display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;margin-top:2px;
}
.q{
  min-width:0;background:rgba(7,12,18,.97);
  padding:3px 1px;text-align:center;
  font-size:9px;font-weight:900;line-height:1;
}
.q small{
  display:block;font-size:6px;color:var(--muted);
  margin-bottom:2px;font-weight:700;
}
.latest{
  width:100%;margin:3px 0 0;
  border-radius:3px;padding:4px 7px;
  background:rgba(7,12,18,.95);
  border:1px solid rgba(255,255,255,.10);
  font-size:13px;font-weight:700;
  line-height:1.35;
  text-align:left;
}
.latest-event{
  display:grid;
  grid-template-columns:100px minmax(0,1fr) 42px 38px 55px;
  align-items:center;
  column-gap:5px;
  white-space:nowrap;
  overflow:hidden;
  min-height:19px;
  margin:1px 0;
}
.latest-event .latest-tag{
  display:block;
  width:100%;
  box-sizing:border-box;
  padding:2px 7px;
  border-radius:4px;
  background:var(--green);
  color:#07101a;
  font-size:11px;
  line-height:1.1;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:center;
}
.latest-event .latest-player{
  color:#fff;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
}
.latest-event .latest-time{
  color:#aeb8c4;font-size:10px;font-weight:800;text-align:center;white-space:nowrap;
}
.latest-event .latest-team{
  color:var(--green);
  font-size:10px;
  font-weight:900;
  text-align:center;
  white-space:nowrap;
}
.latest-event .latest-score{
  color:#fff;
  font-weight:900;
  text-align:right;
  white-space:nowrap;
}
.latest b{color:var(--green)}

button{
  border:0;background:#202938;color:#fff;padding:6px 9px;
  border-radius:5px;cursor:pointer;
}
#raw{
  display:none;position:fixed;inset:50px 2vw 2vw;background:#05070a;
  color:#9cffb7;border:1px solid #283342;border-radius:9px;padding:15px;
  overflow:auto;white-space:pre-wrap;font:12px Consolas,monospace;z-index:90;
}
#error{
  display:none;position:fixed;top:10px;left:10px;right:10px;
  background:#321318;color:#ffb3b3;border-radius:7px;
  padding:8px 12px;font-weight:800;z-index:100;text-align:center;
}
.live-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:#68e58d;margin-right:3px;
  box-shadow:0 0 0 0 rgba(104,229,141,.7);
  animation:pulse 1.7s infinite;
}
@keyframes pulse{
  70%{box-shadow:0 0 0 5px rgba(104,229,141,0)}
  100%{box-shadow:0 0 0 0 rgba(104,229,141,0)}
}
@media(max-width:500px){
  .overlay{width:calc(100vw - 6px)}
  .mainbar{grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr)}
  .logo-plate{width:48px;flex-basis:48px}
  .logo{width:36px;height:36px}
  .teamname{font-size:10px;max-width:62px}
  .foulballs{width:56px;height:11px;top:2px;gap:1px}
  .foulball{width:9px;height:9px;min-width:9px;min-height:9px;flex-basis:9px}
  .score{font-size:38px}
}

</style>
</head>
<body>
<div class="overlay">
  <div class="mainbar">
    <div class="team home">
      <div class="logo-plate"><img id="homeLogo" class="logo" alt=""></div>
      <div class="team-copy">
        <div id="homeFoulsBalls" class="foulballs" aria-label="Kotijoukkueen virheet"><span class="foulball"></span><span class="foulball"></span><span class="foulball"></span><span class="foulball"></span><span class="foulball"></span></div>
        <div id="homeName" class="teamname"><span class="teamline1">KOTI</span><span class="teamline2"></span></div>
        <div class="score-wrap">
          <div id="homeScore" class="score">–</div>
        </div>
      </div>
    </div>

    <div class="center">
      <div id="period" class="period">–</div>
      <div id="clock" class="clock">–:–</div>
      <div id="timeouts" class="timeouts"></div>
    </div>

    <div class="team away">
      <div class="team-copy">
        <div id="awayFoulsBalls" class="foulballs" aria-label="Vierasjoukkueen virheet"><span class="foulball"></span><span class="foulball"></span><span class="foulball"></span><span class="foulball"></span><span class="foulball"></span></div>
        <div id="awayName" class="teamname"><span class="teamline1">VIERAS</span><span class="teamline2"></span></div>
        <div class="score-wrap">
          <div id="awayScore" class="score">–</div>
        </div>
      </div>
      <div class="logo-plate"><img id="awayLogo" class="logo" alt=""></div>
    </div>
  </div>
  <div id="simBadge" style="display:none;position:absolute;right:0;top:-20px;background:#f5c400;color:#111;padding:3px 7px;font:900 10px Arial;letter-spacing:.05em;border-radius:2px">OTTELUSIMULAATIO</div>
  <div id="quarters" class="quarters"></div>
  <div id="latest" class="latest"><b>LIVE</b>&nbsp; Odotetaan ottelutapahtumia…</div>
</div>
<pre id="raw"></pre>
<div id="error"></div>

<script>
(() => {
const API="https://embed-api.eui.connect.sportradar.com/v1/embed/322/fixture_detail";
const params=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);
let fixtureId=params.get("fixtureId")||"";
let busy=false, timer=null, lastData=null;
let previousFoulsA=null, previousFoulsB=null;

// Pelikellon paikallinen ankkuri: Sportradar synkronoi ajan 3 s välein,
// selain piirtää sekunnit niiden välissä vain pelin ollessa käynnissä.
let clockBaseSeconds=null, clockAnchorMs=0, clockIsRunning=false;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function applyUrlScale(){
 const raw=params.get("scale"), value=raw===null?100:Number(raw);
 const scale=Number.isFinite(value)?Math.max(25,Math.min(300,value))/100:1;
 document.querySelector(".overlay")?.style.setProperty("--scale",scale);
}
applyUrlScale();

function decodeState(input){
 let state=String(input||"").trim();
 if(/^https?:\/\//i.test(state)){
   const u=new URL(state);
   const s=u.searchParams.get("state"); if(s)state=s;
   else {const q=u.search.replace(/^\?/,""), i=q.indexOf("~w=f~"); if(i>=0)state=q.slice(i+5).split("&")[0];}
 }
 if(state.includes("~w=f~"))state=state.split("~w=f~")[1].split("&")[0];
 const normalized=state.replace(/-/g,"+").replace(/_/g,"/");
 const padded=normalized+"=".repeat((4-normalized.length%4)%4);
 const bytes=Uint8Array.from(atob(padded),c=>c.charCodeAt(0));
 if(!("DecompressionStream" in window))throw Error("Selain ei tue Basket.fi state-tunnisteen purkamista.");
 return new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
}
async function resolveFixture(){
 if(fixtureId)return fixtureId;
 const input=params.get("state")||params.get("url");
 if(input){
   const obj=JSON.parse(await new Response(await decodeState(input)).text());
   if(obj.f){fixtureId=obj.f;return fixtureId;}
 }
 // Optional legacy match id support: use Basket.fi's own daily fixture list only to map ID.
 const match=params.get("match");
 if(match){
   const now=new Date();
   const localDate=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
   const date=params.get("date")||localDate;
   const seed="ysnyp4h6e9egetkc3s3v";
   const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("getMatches?"+seed+"&date="+date));
   const hash=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
   const url="https://koripallo-api.torneopal.net/taso/rest/getMatches?date="+encodeURIComponent(date)+"&hash="+hash;
   const r=await fetch(url,{cache:"no-store",headers:{"Accept":"json/df8e84j9xtdz269euy3h","Referer":"https://tulospalvelu.basket.fi/"}});
   if(!r.ok)throw Error("Ottelun tunnisteen haku epäonnistui: TorneoPal HTTP "+r.status);
   const data=await r.json();
   let found=null; const seen=new Set();
   function walk(v){if(!v||typeof v!=="object"||seen.has(v)||found)return;seen.add(v);
     if(!Array.isArray(v)&&v.match_id!=null&&String(v.match_id)===String(match)){found=v;return;}
     for(const x of Object.values(v))walk(x);
   }
   walk(data);
   if(!found?.match_external_id)throw Error("Ottelulle "+match+" ei löytynyt Sportradar-tunnistetta.");
   fixtureId=found.match_external_id;return fixtureId;
 }
 throw Error("Ottelun tunniste puuttuu. Anna URL-parametri match (Basket.fi-ottelunumero), fixtureId tai state.");
}
async function fetchFixture(){
 const id=await resolveFixture();
 const r=await fetch(API+"?fixtureId="+encodeURIComponent(id),{cache:"no-store",headers:{"Accept":"application/json"}});
 const body=await r.text();
 if(!r.ok)throw Error("Sportradar HTTP "+r.status+" — "+body.slice(0,300));
 let data;try{data=JSON.parse(body)}catch{throw Error("Sportradar ei palauttanut JSON-dataa.");}
 if(data.error||data.errors)throw Error(JSON.stringify(data.error||data.errors));
 return data.data||data;
}
function setTeamName(id,name){
 const el=$(id), words=String(name||"").trim().split(/\s+/);let a="",b="";
 if(words.length<=1)a=words.join("");
 else {let best=1,diff=Infinity;for(let i=1;i<words.length;i++){const d=Math.abs(words.slice(0,i).join(" ").length-words.slice(i).join(" ").length);if(d<diff){diff=d;best=i;}}a=words.slice(0,best).join(" ");b=words.slice(best).join(" ");}
 el.querySelector(".teamline1").textContent=a||"–";el.querySelector(".teamline2").textContent=b;el.querySelector(".teamline2").style.display=b?"block":"none";
}
function parseClockSeconds(v){
 if(v===null||v===undefined||v==="")return null;
 if(typeof v==="number"&&Number.isFinite(v))return Math.max(0,Math.floor(v));
 const value=String(v).trim();
 // Sportradarin ISO 8601 -kesto, esim. PT7M32S
 const iso=value.match(/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\\.\d+)?)S)?$/i);
 if(iso)return Math.max(0,Math.floor(Number(iso[1]||0)*3600+Number(iso[2]||0)*60+Number(iso[3]||0)));
 // Tavallinen pelikello, esim. 7:32 tai 07:32
 const mmss=value.match(/^(\d+):(\d{1,2})(?:[.,](\d+))?$/);
 if(mmss)return Math.max(0,Number(mmss[1])*60+Number(mmss[2]));
 // Sekuntimäärä merkkijonona
 if(/^\d+(?:\\.\d+)?$/.test(value))return Math.max(0,Math.floor(Number(value)));
 return null;
}
function formatClockSeconds(seconds){
 if(seconds===null||!Number.isFinite(seconds))return "–:–";
 const n=Math.max(0,Math.floor(seconds));
 return Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
}
function clockRunning(status){
 // Sportradar palauttaa tilan tässä upotuksessa usein fixture.status-kentässä.
 const candidates=[status?.period,status?.fixture,status?.match,status?.status,status?.fixtureStatus,status?.statusLabel];
 return candidates.some(v=>{
   if(typeof v==="string")return /IN_PROGRESS|INPROGRESS|LIVE|RUNNING/i.test(v);
   if(v&&typeof v==="object")return Object.values(v).some(x=>typeof x==="string"&&/IN_PROGRESS|INPROGRESS|LIVE|RUNNING/i.test(x));
   return false;
 });
}
function syncClock(status,d){
 const raw=status.clock??status.gameClock??status.remainingTime??d.clock;
 const seconds=parseClockSeconds(raw);
 if(seconds===null){
   clockBaseSeconds=null;clockIsRunning=false;
   $("clock").textContent="–:–";
   return;
 }
 // Jokainen palvelinpäivitys synkronoi paikallisen kellon uudelleen.
 clockBaseSeconds=seconds;
 clockAnchorMs=Date.now();
 clockIsRunning=clockRunning(status);
 renderClock();
}
function renderClock(){
 if(clockBaseSeconds===null){$("clock").textContent="–:–";return;}
 const elapsed=clockIsRunning?(Date.now()-clockAnchorMs)/1000:0;
 $("clock").textContent=formatClockSeconds(Math.max(0,clockBaseSeconds-elapsed));
}
function allEvents(d){return (d.periodData||[]).flatMap(p=>(p.events||[]).map(e=>({...e,_period:p.periodId})));}

function renderFoulBalls(id,count,old){
 const balls=$(id).querySelectorAll(".foulball"), n=Math.max(0,Math.min(5,Number(count)||0)), prev=old==null?0:Math.max(0,Math.min(5,Number(old)||0));
 balls.forEach((b,i)=>{b.classList.toggle("active",i<n);b.classList.toggle("new",old!=null&&n>prev&&i===n-1);});
}
function eventType(e){
 const t=String(e.eventType||"").toLowerCase(), s=String(e.eventSubType||"").toLowerCase();
 if(t==="foul"&&s!=="drawn")return "foul";
 if(t==="3pt"&&e.success===true)return "score3";
 if(t==="2pt"&&e.success===true)return "score2";
 if(t==="freethrow"&&e.success===true)return "ft";
 if(t==="timeout")return "timeout";
 return "other";
}
function eventLabel(e){
 const t=String(e.eventType||"").toLowerCase();
 if(t==="foul")return e.eventSubType==="drawn"?"VIRHE HANKITTU":"VIRHE";
 if(t==="3pt")return e.success===false?"OHITETTU 3P":"3 PISTETTÄ";
 if(t==="2pt")return e.success===false?"OHITETTU 2P":"2 PISTETTÄ";
 if(t==="freethrow")return "VAPAAHEITTO";
 if(t==="timeout")return "AIKALISÄ";
 return String(e.desc||t||"TAPAHTUMA").toUpperCase();
}
function scoreForEvent(e,homeId,awayId){
 const s=e.scores||{};
 return s[homeId]!==undefined&&s[awayId]!==undefined?String(s[homeId])+"–"+String(s[awayId]):"";
}
function eventClock(e){
 const seconds=parseClockSeconds(e.clock);
 return seconds===null?"":formatClockSeconds(seconds);
}
function renderLatest(events,homeId,awayId){
 // Näytetään ainoastaan onnistuneet korit/vapaaheitot, tehdyt virheet ja aikalisät.
 // Ohiheitot, levypallot, syötöt, menetykset, vaihdot ym. jätetään pois.
 const useful=events.filter(e=>['score2','score3','ft','foul','timeout'].includes(eventType(e)));
 const recent=useful.slice(-3).reverse();
 if(!recent.length){$("latest").innerHTML="<b>LIVE</b>&nbsp; Ei pelitapahtumia";return;}
 $("latest").innerHTML=recent.map(e=>{
   const label=eventLabel(e), player=e.name?('#'+(e.bib||'')+' '+e.name):String(e.desc||'');
   const team=e.entityId===homeId?"KOTI":e.entityId===awayId?"VIERAS":"";
   const typ=eventType(e), score=typ==="foul"?"VIRHE":scoreForEvent(e,homeId,awayId);
   return `<div class="latest-event"><span class="latest-tag">${esc(label)}</span><span class="latest-player">${esc(player)}</span><span class="latest-team">${esc(team)}</span><span class="latest-time">${esc(eventClock(e))}</span><span class="latest-score">${esc(score)}</span></div>`;
 }).join("");
}
function render(d){
 const f=d.fixture||{}, c=f.competitors||[];
 const home=c.find(x=>x.isHome)||c[0]||{}, away=c.find(x=>!x.isHome)||c[1]||{};
 const homeId=home.entityId,awayId=away.entityId;
 setTeamName("homeName",home.name||"KOTI");setTeamName("awayName",away.name||"VIERAS");
 if(home.logo)$("homeLogo").src=home.logo;if(away.logo)$("awayLogo").src=away.logo;
 const status=d.status||{};
 const events=allEvents(d);
 const statusLabel=String(f.statusLabel||f.status||status.fixtureStatus||status.status||"").toLowerCase();
 const isFinal=/final|finished|complete|ended|confirmed/.test(statusLabel);

function clone(obj){return JSON.parse(JSON.stringify(obj));}
function simEvents(){
 return (SIM_DATA.periodData||[]).flatMap(p=>(p.events||[]).map((e,i)=>({...e,_period:Number(p.periodId),_order:i})));
}
function scoreAtEvent(e,homeId,awayId){
 const s=e?.scores||{};
 return {home:Number(s[homeId]??0),away:Number(s[awayId]??0)};
}
function makeSimulationFrame(index,all){
 const event=all[index], pno=Number(event._period||1);
 const f=clone(SIM_DATA);
 const home=f.fixture.competitors.find(x=>x.isHome)||f.fixture.competitors[0];
 const away=f.fixture.competitors.find(x=>!x.isHome)||f.fixture.competitors[1];
 const score=scoreAtEvent(event,home.entityId,away.entityId);
 home.score=String(score.home);away.score=String(score.away);
 const periods=[];
 for(const src of (SIM_DATA.periodData||[])){
   const n=Number(src.periodId);
   if(n>pno)break;
   const cp=clone(src);
   if(n===pno){
     cp.events=(src.events||[]).slice(0,Number(event._order)+1);
     cp.ended=false;
     const before=(SIM_DATA.periodData||[]).filter(x=>Number(x.periodId)<n).reduce((acc,x)=>{
       const s=x.teamScore||{};acc[home.entityId]+=Number(s[home.entityId]||0);acc[away.entityId]+=Number(s[away.entityId]||0);return acc;
     },{[home.entityId]:0,[away.entityId]:0});
     cp.teamScore={
       [home.entityId]:Math.max(0,score.home-before[home.entityId]),
       [away.entityId]:Math.max(0,score.away-before[away.entityId])
     };
   }
   periods.push(cp);
 }
 f.periodData=periods;
 f.fixture.status="IN_PROGRESS";
 f.fixture.statusLabel="Live";
 f.status={periodId:pno,clock:event.clock||"PT10M0S"};
 return f;
}
function simDelay(previous,current,speed){
 const a=parseClockSeconds(previous?.clock), b=parseClockSeconds(current?.clock);
 let gameSeconds=(a!==null&&b!==null)?Math.max(0,a-b):0;
 // A small visible pause between events, with longer gaps following the game clock.
 return Math.max(80,Math.min(1200,(gameSeconds*1000)/speed));
}
function startSimulation(){
 const speedRaw=Number(params.get("sim")||20);
 const speed=Math.max(1,Math.min(120,Number.isFinite(speedRaw)?speedRaw:20));
 const events=simEvents();
 if(!events.length){showError(new Error("Simulaatiodatasta ei löytynyt tapahtumia."));return;}
 $("simBadge").style.display="block";
 $("simBadge").textContent="SIMULAATIO · "+speed+"×";
 // Alkunäkymä 0–0, ensimmäisen erän aloituskellolla.
 const initial=clone(SIM_DATA);
 const home=initial.fixture.competitors.find(x=>x.isHome)||initial.fixture.competitors[0];
 const away=initial.fixture.competitors.find(x=>!x.isHome)||initial.fixture.competitors[1];
 home.score="0";away.score="0";
 initial.periodData=[{...clone(SIM_DATA.periodData[0]),events:[],teamScore:{[home.entityId]:0,[away.entityId]:0},ended:false}];
 initial.fixture.status="IN_PROGRESS";initial.fixture.statusLabel="Live";
 initial.status={periodId:1,clock:"PT10M0S"};
 render(initial);
 let i=0;
 function step(){
   if(i>=events.length){
     const final=clone(SIM_DATA);
     final.fixture.status="CONFIRMED";final.fixture.statusLabel="Final";
     final.status={periodId:4,clock:"PT0S"};
     render(final);
     $("simBadge").textContent="SIMULAATIO · VALMIS";
     return;
   }
   const ev=events[i];
   render(makeSimulationFrame(i,events));
   const prev=i>0?events[i-1]:null;
   const delay=simDelay(prev,ev,speed);
   i++;
   setTimeout(step,delay);
 }
 // Aloita ensimmäisestä tapahtumasta pienen alkunäytön jälkeen.
 setTimeout(step,450);
}
async function poll(){if(busy)return;busy=true;try{lastData=await fetchFixture();render(lastData);}catch(e){showError(e);}finally{busy=false;}}
if(params.has("sim")){
 startSimulation();
}else{
 poll();
 setInterval(poll,3000);
}
setInterval(renderClock,200);
})();
