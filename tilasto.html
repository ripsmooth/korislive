<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basket.fi – Sarjataulukko – VK 2026–27 – 1920x1080 lähetys</title>
<style>
:root{--ink:#101820;--panel:#1b2a35;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--scale:1;--gfx-width:1100px;--offset-x:0px;--offset-y:0px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}
.wrap{width:var(--gfx-width);max-width:none;background:rgba(16,24,32,.97);overflow:hidden;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));transform:translate(var(--offset-x),var(--offset-y)) scale(var(--scale));transform-origin:center center;border:0}
.head{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--ink);border-bottom:4px solid var(--accent);padding:12px 20px;position:relative}
.title{font-size:25px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.subtitle{margin-left:auto;font-size:15px;color:var(--muted);font-weight:800;text-align:right;white-space:nowrap}
.table{width:100%;background:rgba(16,24,32,.97)}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) 72px 72px 72px 90px 130px 70px;min-height:49px;align-items:center;border-bottom:1px solid #34434d}
.row:last-child{border-bottom:0}
.row.header{min-height:38px;color:var(--ink);font-size:13px;font-weight:900;letter-spacing:.04em;background:var(--accent);border-bottom:0}
.cell{padding:8px 9px;text-align:right;font-size:17px;font-weight:800;white-space:nowrap}
.header .cell{font-size:13px;text-transform:uppercase;letter-spacing:.04em;padding:10px 9px}
.cell.team{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:900;text-transform:uppercase}
.row:nth-child(even){background:rgba(27,42,53,.96)}
.row.top{background:#263b48;box-shadow:inset 4px 0 0 var(--accent)}
.pos{color:var(--accent);font-weight:900}
.points{color:var(--accent);font-size:20px;font-weight:900}
.status{min-height:39px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(16,24,32,.96);color:var(--muted);font-size:12px;border-top:2px solid var(--accent)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--accent)}
.error{padding:12px 14px;background:rgba(16,24,32,.96);color:#ff8a8a;font-size:14px;line-height:1.35;display:none;border-left:4px solid var(--accent)}
.url-control{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel);font-size:12px}
.url-control label{color:var(--muted);font-weight:800;white-space:nowrap}
.url-control input{flex:1;min-width:0;height:30px;box-sizing:border-box;padding:0 9px;border:1px solid rgba(255,255,255,.22);border-radius:2px;background:#fff;color:#111;font-size:12px}
.url-control button{height:30px;padding:0 12px;border:0;border-radius:2px;background:var(--accent);color:var(--ink);font-weight:900;cursor:pointer;font-size:12px}
.url-control button:hover{filter:brightness(1.05)}
@media(max-width:700px){.head{min-height:48px;padding:8px 12px}.title{font-size:18px}.subtitle{font-size:11px}.row{grid-template-columns:32px minmax(0,1fr) 38px 38px 38px 48px 76px 38px;min-height:34px}.cell{font-size:12px;padding:6px 4px}.row.header{min-height:32px}.header .cell{font-size:10px;padding:7px 4px}.points{font-size:14px}.status{font-size:10px}.url-control{gap:5px;padding:6px}.url-control label{font-size:10px}.url-control input{height:27px;font-size:10px}.url-control button{height:27px;padding:0 7px;font-size:10px}}
</style>
</head>
<body>
<script>
(function(){
 const q=new URLSearchParams(location.search);
 const width=Number(q.get('width'));
 const scale=Number(q.get('scale'));
 const ox=Number(q.get('offsetX'));
 const oy=Number(q.get('offsetY'));
 if(Number.isFinite(width)&&width>=500&&width<=1920)document.documentElement.style.setProperty('--gfx-width',width+'px');
 if(Number.isFinite(scale)&&q.has('scale')&&scale>0)document.documentElement.style.setProperty('--scale',Math.max(.5,Math.min(2.5,scale)));
 if(Number.isFinite(ox)&&q.has('offsetX'))document.documentElement.style.setProperty('--offset-x',ox+'px');
 if(Number.isFinite(oy)&&q.has('offsetY'))document.documentElement.style.setProperty('--offset-y',oy+'px');
})();
</script>

<div class="wrap">
  <div class="head">
    <div class="title" id="title">SARJATAULUKKO</div>
    <div class="subtitle" id="groupName">Ladataan…</div>
  </div>

  <div class="table">
    <div class="row header">
      <div class="cell">#</div>
      <div class="cell team">JOUKKUE</div>
      <div class="cell">O</div>
      <div class="cell">V</div>
      <div class="cell">H</div>
      <div class="cell">V%</div>
      <div class="cell">KORIT</div>
      <div class="cell">P</div>
    </div>
    <div id="rows"></div>
  </div>

  <div class="error" id="error"></div>
  <div class="status">
    <div><span class="dot"></span><span id="statusText">Päivitetään automaattisesti</span></div>
    <div id="updated">–</div>
  </div>
</div>

<script>
const API = "https://koripallo-api.torneopal.net/taso/rest/";
const ACCEPT_VALUE = "json/df8e84j9xtdz269euy3h";

/* Oletussarja, jos URL:ssa ei anneta ottelun ID:tä */
const DEFAULT_COMPETITION_ID = "vk2627";
const DEFAULT_CATEGORY_ID = "14";
const DEFAULT_GROUP_ID = "303254";

/* Ottelun ID voidaan antaa esim. ?match=1013475 tai ?ottelu=1013475.
   Sen perusteella selvitetään sarja ja lohko TorneoPalin getMatch-rajapinnasta. */
const URL_PARAMS = new URLSearchParams(location.search);
const MATCH_ID = URL_PARAMS.get("match") || URL_PARAMS.get("ottelu") || URL_PARAMS.get("match_id") || "";
let COMPETITION_ID = DEFAULT_COMPETITION_ID;
let CATEGORY_ID = DEFAULT_CATEGORY_ID;
let GROUP_ID = DEFAULT_GROUP_ID;
let matchContextResolved = !MATCH_ID;
let matchContextPromise = null;

/* Päivitysväli millisekunteina */
const REFRESH_MS = 10000;

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function num(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function pct(won, played){
  if(!played) return "–";
  return Math.round((won / played) * 100) + "%";
}

function getTeams(data){
  if(Array.isArray(data?.group?.teams)) return data.group.teams;
  if(Array.isArray(data?.teams)) return data.teams;
  return [];
}

function getMatches(data){
  if(Array.isArray(data?.group?.matches)) return data.group.matches;
  if(Array.isArray(data?.matches)) return data.matches;
  return [];
}

function teamLogoFromObject(t){
  return t.club_A_crest || t.club_B_crest ||
         t.club_crest || t.club_logo || t.team_logo ||
         t.logo || t.img_url || t.image_url || "";
}

function asId(value){
  if(value === undefined || value === null || value === "") return "";
  if(typeof value === "object") return String(value.id ?? value.group_id ?? value.category_id ?? value.competition_id ?? "");
  return String(value);
}

function firstId(objects, keys){
  for(const obj of objects){
    if(!obj || typeof obj !== "object") continue;
    for(const key of keys){
      const id = asId(obj[key]);
      if(id) return id;
    }
  }
  return "";
}

async function resolveMatchContext(){
  if(!MATCH_ID || matchContextResolved) return;
  if(matchContextPromise) return matchContextPromise;
  matchContextPromise = (async()=>{
    const url = API + "getMatch?match_id=" + encodeURIComponent(MATCH_ID) + "&timeStamp=" + Date.now();
    const r = await fetch(url, {cache:"no-store", headers:{"Accept":ACCEPT_VALUE}});
    if(!r.ok) throw new Error("Ottelun " + MATCH_ID + " tietojen haku epäonnistui (HTTP " + r.status + ").");
    const response = await r.json();
    if(response?.call?.status === "error") throw new Error(response.call.error || "Ottelun tietoja ei löytynyt.");
    const m = response?.match || response?.data?.match || response?.data || response;
    const objects = [m, m?.group, m?.category, m?.competition, response?.match, response?.data, response];
    const competition = firstId(objects, ["competition_id", "competitionId", "tournament_id", "tournamentId"]);
    const category = firstId(objects, ["category_id", "categoryId", "series_id", "seriesId"]);
    const group = firstId(objects, ["group_id", "groupId", "pool_id", "poolId", "division_id", "divisionId"]);
    if(!competition || !category || !group){
      throw new Error("Ottelu " + MATCH_ID + " löytyi, mutta sarjan ja lohkon tunnisteita ei saatu otteluvastauksesta. Tarkista, palauttaako getMatch competition_id-, category_id- ja group_id-tiedot.");
    }
    COMPETITION_ID = competition;
    CATEGORY_ID = category;
    GROUP_ID = group;
    matchContextResolved = true;
  })();
  try { await matchContextPromise; }
  finally { matchContextPromise = null; }
}

async function fetchTeamDetails(teamId){
  if(!teamId) return {};
  try{
    const url = API +
      "getTeam?team_id=" + encodeURIComponent(teamId) +
      "&competition_id=" + encodeURIComponent(COMPETITION_ID) +
      "&category_id=" + encodeURIComponent(CATEGORY_ID) +
      "&timeStamp=" + Date.now();

    const r = await fetch(url,{
      cache:"no-store",
      headers:{ "Accept":ACCEPT_VALUE }
    });
    if(!r.ok) return {};
    const d = await r.json();
    return d?.team || d || {};
  }catch(e){
    return {};
  }
}

async function loadStandings(){
  await resolveMatchContext();
  const url =
    API +
    "getGroup" +
    "?competition_id=" + encodeURIComponent(COMPETITION_ID) +
    "&category_id=" + encodeURIComponent(CATEGORY_ID) +
    "&group_id=" + encodeURIComponent(GROUP_ID) +
    "&matches=1" +
    "&timeStamp=" + Date.now();

  const r = await fetch(url,{
    cache:"no-store",
    headers:{ "Accept":ACCEPT_VALUE }
  });

  if(!r.ok) throw new Error("HTTP " + r.status);

  const data = await r.json();

  if(data?.call?.status === "error"){
    throw new Error(data.call.error || "API-virhe");
  }

  const teams = getTeams(data);

  if(!teams.length){
    throw new Error("Sarjataulukon joukkueita ei löytynyt API-vastauksesta.");
  }

  const mainTitle =
    data?.group?.category_name ||
    data?.category_name ||
    data?.competition?.category_name ||
    "";

  const groupName =
    data?.group?.group_name ||
    data?.group?.name ||
    "Ryhmä " + GROUP_ID;

  /* Näytetään pääotsikko ennen lohkon nimeä.
     Esim. "19-vuotiaat pojat, valtakunn. I divisioona – Syksyn Lohko A" */
  $("groupName").textContent = mainTitle
    ? mainTitle + " – " + groupName
    : groupName;

  /* Lasketaan tehdyt/päästetyt korit ottelutiedoista.
     Näin KORIT = tehdyt–päästetyt, ei pisteprosentti. */
  const gf = {};
  const ga = {};

  teams.forEach(t=>{
    gf[t.team_id] = 0;
    ga[t.team_id] = 0;
  });

  const matches = getMatches(data);

  matches.forEach(m=>{
    const a = m.team_A_id;
    const b = m.team_B_id;
    const sa = Number(m.fs_A ?? m.live_A);
    const sb = Number(m.fs_B ?? m.live_B);

    if(!a || !b || !Number.isFinite(sa) || !Number.isFinite(sb)) return;

    if(gf[a] === undefined){ gf[a]=0; ga[a]=0; }
    if(gf[b] === undefined){ gf[b]=0; ga[b]=0; }

    gf[a] += sa;
    ga[a] += sb;
    gf[b] += sb;
    ga[b] += sa;
  });

  /* Haetaan seurojen logot joukkue-ID:n perusteella.
     getTeam voi palauttaa logon eri kenttänimellä eri kilpailuissa,
     joten kaikki yleiset Torneopal-kentät tarkistetaan. */
  const details = await Promise.all(
    teams.map(t=>fetchTeamDetails(t.team_id))
  );

  teams.forEach((t,i)=>{
    const d = details[i] || {};
    t._logo =
      teamLogoFromObject(t) ||
      teamLogoFromObject(d) ||
      teamLogoFromObject(d.club || {}) ||
      teamLogoFromObject(d.team || {});
  });

  teams.sort((a,b)=>{
    const pa = num(a.current_standing);
    const pb = num(b.current_standing);
    if(pa && pb) return pa-pb;
    return num(b.points)-num(a.points);
  });

  $("rows").innerHTML = teams.map((t,i)=>{
    const played = num(t.matches_played);
    const won = num(t.matches_won);
    const lost = num(t.matches_lost);
    const standing = num(t.current_standing) || (i+1);
    const points = num(t.points);
    const made = gf[t.team_id] ?? "–";
    const allowed = ga[t.team_id] ?? "–";

    return `
      <div class="row ${standing===1 ? "top" : ""}">
        <div class="cell pos">${standing}</div>
        <div class="cell team" title="${esc(t.team_name || "")}">
          ${esc(t.team_name || "–")}
        </div>
        <div class="cell">${played}</div>
        <div class="cell">${won}</div>
        <div class="cell">${lost}</div>
        <div class="cell">${pct(won,played)}</div>
        <div class="cell">${made}–${allowed}</div>
        <div class="cell points">${points}</div>
      </div>
    `;
  }).join("");

  $("error").style.display = "none";
  $("statusText").textContent = "Live-data päivitetty";
  $("updated").textContent = new Date().toLocaleTimeString("fi-FI");
}

async function poll(){
  try{
    await loadStandings();
  }catch(e){
    $("statusText").textContent = "Datayhteysvirhe";
    $("error").textContent =
      "Sarjataulukkoa ei voitu päivittää: " + (e?.message || e);
    $("error").style.display = "block";
  }
}

if(MATCH_ID){
  $("groupName").textContent = "Selvitetään ottelun " + MATCH_ID + " sarjaa…";
}
poll();
setInterval(poll, REFRESH_MS);
</script>
</body>
</html>
