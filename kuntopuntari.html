<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koripallo – Kuntopuntari</title>
<style>
:root{--ink:#101820;--panel:#1b2a35;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--green:#6fe08f;--red:#ff7373;--scale:1;--gfx-width:1180px;--offset-x:0px;--offset-y:0px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent;color:var(--white);font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}body{padding:16px;display:flex;justify-content:center;align-items:flex-start}.wrap{width:var(--gfx-width);max-width:100%;background:rgba(16,24,32,.98);overflow:hidden;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));transform:translate(var(--offset-x),var(--offset-y)) scale(var(--scale));transform-origin:top center;border:1px solid #34434d}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--ink);border-bottom:4px solid var(--accent);padding:14px 20px}.title{font-size:26px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.subtitle{font-size:14px;color:var(--muted);font-weight:800;text-align:right}.matchline{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;padding:18px 20px;background:linear-gradient(110deg,#1b2a35,#101820)}.team{display:flex;align-items:center;gap:12px;min-width:0}.team.away{justify-content:flex-end;text-align:right}.logo{width:54px;height:54px;object-fit:contain}.teamname{font-size:19px;font-weight:900;text-transform:uppercase}.score{font-size:25px;font-weight:900;color:var(--accent);white-space:nowrap}.vs{color:var(--muted);font-weight:900;font-size:12px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.team-panel{min-width:0;border:1px solid #34434d;background:#15222c}.panel-head{padding:10px 12px;background:#263b48;border-bottom:2px solid var(--accent);font-size:16px;font-weight:900;text-transform:uppercase}.form{display:flex;gap:6px;padding:12px;align-items:center;flex-wrap:wrap}.form-item{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:14px;font-weight:900;color:#101820;background:#5d6a73}.form-item.win{background:var(--green)}.form-item.loss{background:var(--red)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#34434d;border-top:1px solid #34434d}.stat{padding:10px 6px;background:#101820;text-align:center}.stat .value{font-size:21px;font-weight:900;color:var(--accent)}.stat .label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-top:3px}.recent{padding:0 12px 12px}.recent-title{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.06em;padding:5px 0 7px}.game{display:grid;grid-template-columns:70px minmax(0,1fr) 62px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #34434d;font-size:12px}.game-date{color:var(--muted);font-size:10px}.game-teams{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.game-score{text-align:right;font-size:14px;font-weight:900}.game-score.win{color:var(--green)}.game-score.loss{color:var(--red)}.status{padding:10px 14px;display:flex;justify-content:space-between;gap:12px;background:#101820;color:var(--muted);font-size:11px;border-top:2px solid var(--accent)}.error{display:none;color:#ffb3b3;padding:12px;background:#321318;font-weight:700;font-size:13px}.empty{padding:12px;color:var(--muted);font-size:12px}.loading{color:var(--muted)}@media(max-width:650px){body{padding:4px}.head{padding:10px 12px}.title{font-size:18px}.subtitle{font-size:10px}.matchline{padding:12px 8px;gap:6px}.team{gap:5px}.logo{width:32px;height:32px}.teamname{font-size:12px}.score{font-size:18px}.columns{grid-template-columns:1fr;padding:6px;gap:8px}.panel-head{font-size:13px}.stat .value{font-size:17px}.game{grid-template-columns:55px minmax(0,1fr) 52px}}
</style></head><body><main class="wrap" id="wrap">
<header class="head"><div class="title">Kuntopuntari</div><div class="subtitle" id="subtitle">Ladataan ottelutietoja…</div></header>
<section class="matchline"><div class="team"><img class="logo" id="logoA" alt=""><div><div class="teamname" id="nameA">KOTI</div><div class="subtitle" id="recordA"></div></div></div><div class="vs">VS</div><div class="team away"><div><div class="teamname" id="nameB">VIERAS</div><div class="subtitle" id="recordB"></div></div><img class="logo" id="logoB" alt=""></div></section>
<div class="columns"><section class="team-panel"><div class="panel-head" id="headA">Kotijoukkue</div><div class="form" id="formA"><span class="loading">Haetaan viime otteluita…</span></div><div class="summary" id="statsA"></div><div class="recent-title" style="padding:10px 12px 5px">VIIMEISIMMÄT OTTELUT</div><div class="recent" id="recentA"></div></section><section class="team-panel"><div class="panel-head" id="headB">Vierasjoukkue</div><div class="form" id="formB"><span class="loading">Haetaan viime otteluita…</span></div><div class="summary" id="statsB"></div><div class="recent-title" style="padding:10px 12px 5px">VIIMEISIMMÄT OTTELUT</div><div class="recent" id="recentB"></div></section></div>
<div class="error" id="error"></div><footer class="status"><span id="statusText">TorneoPal • Kuntopuntari</span><span id="updated">–</span></footer></main>
<script>
(()=>{
const API='https://koripallo-api.torneopal.net/taso/rest/';
const ACCEPT='json/df8e84j9xtdz269euy3h';
const q=new URLSearchParams(location.search);const matchId=q.get('match')||q.get('ottelu')||'1014477';
const scale=Number(q.get('scale'));if(q.has('scale')&&Number.isFinite(scale)&&scale>0)document.documentElement.style.setProperty('--scale',Math.max(.5,Math.min(2,scale/100)));
const ox=Number(q.get('offsetX')),oy=Number(q.get('offsetY'));if(q.has('offsetX')&&Number.isFinite(ox))document.documentElement.style.setProperty('--offset-x',ox+'px');if(q.has('offsetY')&&Number.isFinite(oy))document.documentElement.style.setProperty('--offset-y',oy+'px');
const $=id=>document.getElementById(id);const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path){const r=await fetch(API+path+'&timeStamp='+Date.now(),{cache:'no-store',headers:{Accept:ACCEPT}});if(!r.ok)throw Error('API HTTP '+r.status);const d=await r.json();if(d?.call?.status==='error')throw Error(d.call.error||'API-virhe');return d}
function played(m){return String(m.status||'').toLowerCase()==='played'||(m.fs_A!==''&&m.fs_A!=null&&m.fs_B!==''&&m.fs_B!=null)}
function teamMatches(list,id){return list.filter(m=>String(m.team_A_id)===String(id)||String(m.team_B_id)===String(id)).filter(played).sort((a,b)=>(String(b.date||'')+' '+String(b.time||'')).localeCompare(String(a.date||'')+' '+String(a.time||'')))}
function resultFor(m,id){const home=String(m.team_A_id)===String(id);const own=num(home?m.fs_A:m.fs_B),opp=num(home?m.fs_B:m.fs_A);return {own,opp,win:own>opp,draw:own===opp,opponent:home?m.team_B_name:m.team_A_name,date:m.date||'',id:m.match_id}}
function stats(matches,id){const r=matches.map(m=>resultFor(m,id));const wins=r.filter(x=>x.win).length,losses=r.filter(x=>!x.win&&!x.draw).length;return {played:r.length,wins,losses,pf:r.reduce((s,x)=>s+x.own,0),pa:r.reduce((s,x)=>s+x.opp,0),form:r.slice(0,5)}}
function renderStats(target,s){$(target).innerHTML=[[''+s.played,'OTTELUT'],[`${s.wins}–${s.losses}`,'VOITOT–TAPPiot'.toUpperCase()],[s.played?`${(s.pf/s.played).toFixed(1)} / ${(s.pa/s.played).toFixed(1)}`:'–','TEHDYT / PÄÄSTETYT']].map(x=>`<div class="stat"><div class="value">${esc(x[0])}</div><div class="label">${esc(x[1])}</div></div>`).join('')}
function renderTeam(suffix,team,matches,id){$('name'+suffix).textContent=team.name;$('head'+suffix).textContent=team.name;$('record'+suffix).textContent=`${team.category||''}`;$('logo'+suffix).src=team.logo||'';const st=stats(matches,id);$('form'+suffix).innerHTML=st.form.length?st.form.map(x=>`<span class="form-item ${x.win?'win':x.draw?'':'loss'}" title="${esc(x.date)} ${esc(x.opponent)} ${x.own}–${x.opp}">${x.win?'V':x.draw?'T':'H'}</span>`).join(''):'<span class="empty">Ei aiempia otteluita löytynyt.</span>';renderStats('stats'+suffix,st);$('recent'+suffix).innerHTML=st.form.length?st.form.map(x=>`<div class="game"><div class="game-date">${esc(x.date)}</div><div class="game-teams" title="${esc(x.opponent)}">${esc(x.opponent||'Vastustaja')}</div><div class="game-score ${x.win?'win':x.draw?'':'loss'}">${x.own}–${x.opp}</div></div>`).join(''):'<div class="empty">Ottelutuloksia ei löytynyt.</div>';$('record'+suffix).textContent=`${st.wins} voittoa • ${st.losses} tappiota viimeisistä ${st.played} ottelusta`}
async function start(){try{$('subtitle').textContent='Ottelu '+matchId;const d=await api('getMatch?match_id='+encodeURIComponent(matchId));const m=d.match||d;const a={id:m.team_A_id,name:m.team_A_name||'Kotijoukkue',logo:m.club_A_crest||'',category:m.category_name||''};const b={id:m.team_B_id,name:m.team_B_name||'Vierasjoukkue',logo:m.club_B_crest_dark_bg||m.club_B_crest||'',category:m.category_name||''};if(!a.id||!b.id)throw Error('Ottelusta ei löytynyt joukkueiden tunnisteita.');$('subtitle').textContent=`${m.category_name||m.competition_name||'Koripallo'} • ${m.group_name||''}`;$('statusText').textContent='Haetaan kuluvan kauden ottelut';const [ma,mb]=await Promise.all([api('getMatches?competition_id='+encodeURIComponent(m.competition_id||'')+'&category_id='+encodeURIComponent(m.category_id||'')+'&team_id='+encodeURIComponent(a.id)),api('getMatches?competition_id='+encodeURIComponent(m.competition_id||'')+'&category_id='+encodeURIComponent(m.category_id||'')+'&team_id='+encodeURIComponent(b.id))]);const la=teamMatches(ma.matches||[],a.id).filter(x=>String(x.match_id)!==String(matchId));const lb=teamMatches(mb.matches||[],b.id).filter(x=>String(x.match_id)!==String(matchId));renderTeam('A',a,la,a.id);renderTeam('B',b,lb,b.id);$('statusText').textContent='Tiedot haettu TorneoPalista';$('updated').textContent='Päivitetty '+new Date().toLocaleTimeString('fi-FI');}catch(e){$('error').style.display='block';$('error').textContent='Kuntopuntaria ei voitu ladata: '+(e?.message||e)+'. Jos näkyy Failed to fetch, kyse voi olla selaimen CORS-rajoituksesta.';$('statusText').textContent='Datayhteysvirhe'}}
start();
})();
</script></body></html>
